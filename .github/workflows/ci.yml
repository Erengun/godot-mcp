# NOTE: written alongside the 2.0 rewrite but not yet executed on GitHub.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Godot ${{ env.GODOT_VERSION }}
        run: |
          set -euo pipefail
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o godot.zip "$url"
          unzip -q godot.zip -d "$HOME/godot"
          echo "GODOT_PATH=$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Install a virtual display for rendering tests
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1 mesa-vulkan-drivers
      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run build
      - run: npm run check:gdscript
      - run: npm run test:unit
      - name: Integration tests (real Godot, virtual display)
        run: xvfb-run -a -s "-screen 0 1280x720x24" npm run test:integration
